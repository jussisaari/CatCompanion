[project]
name = "catcompanion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gitjussi", email = "jussi2001@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "playsound==1.2.2",
    "pyside6>=6.12.0",
    "screeninfo>=0.8.1",
]

[project.scripts]
catcompanion = "catcompanion:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
